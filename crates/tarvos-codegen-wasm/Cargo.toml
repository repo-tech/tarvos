[package]
name = "tarvos-codegen-wasm"
version = "1.3.1"
edition = "2021"

[dependencies]
tarvos-ir = { path = "../tarvos-ir" }
tarvos-types = { path = "../tarvos-types" }
wasm-encoder = "0.16"
anyhow = "1.0"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
debug = 0
panic = "abort"
strip = true