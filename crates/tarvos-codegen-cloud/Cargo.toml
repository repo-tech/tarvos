[package]
name = "tarvos-codegen-cloud"
version = "1.3.1"
edition = "2021"

[dependencies]
tarvos-ir = { path = "../tarvos-ir" }
tarvos-types = { path = "../tarvos-types" }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
debug = 0
panic = "abort"
strip = true