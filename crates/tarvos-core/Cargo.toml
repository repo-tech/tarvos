[package]
name = "tarvos-core"
version = "1.1.0-rc.2"
edition = "2021"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["multipart", "ws"] }
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tarvos-analysis = { path = "../tarvos-analysis" }
tarvos-codegen-rust = { path = "../tarvos-codegen-rust" }
tarvos-optimizer = { path = "../tarvos-optimizer" }
tarvos-parser = { path = "../tarvos-parser" }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
