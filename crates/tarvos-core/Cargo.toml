[package]
name = "tarvos-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
tarvos-ruff-frontend = { package = "tarvos", path = "../../compiler" }
axum = { version = "0.7", features = ["multipart", "ws"] }
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tarvos-analysis = { path = "../tarvos-analysis" }
tarvos-ast = { path = "../tarvos-ast" }
tarvos-codegen-rust = { path = "../tarvos-codegen-rust" }
tarvos-ir = { path = "../tarvos-ir" }
tarvos-optimizer = { path = "../tarvos-optimizer" }
tarvos-parser = { path = "../tarvos-parser" }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
