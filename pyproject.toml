[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tarvos"
version = "1.5.0"
description = "Ultra-fast Python to Native Rust Transpiler and Compiler"
readme = "README.md"
authors = [{ name = "Repo-Tech Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.scripts]
tarvos = "tarvos:main"
