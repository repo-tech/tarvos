name: Production CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: tarvos.exe
            run_tests: true
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            binary_name: tarvos.exe
            run_tests: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: tarvos
            run_tests: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: tarvos
            run_tests: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: tarvos
            run_tests: false

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Windows GNU Toolchain (if needed)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH

      - name: Cargo Build (Release)
        run: cargo build --release --target ${{ matrix.target }} -p tarvos-cli

      - name: Run Full Test Suite (native host target)
        if: matrix.run_tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Run 1.0 Production Validation Suite
        if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-msvc'
        run: python validation/run_validation.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarvos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          if-no-files-found: error
