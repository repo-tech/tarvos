name: CI

# Fast compiler health only.
#
# This workflow answers "is the current source healthy?". It never builds
# release artifacts, never touches a tag, and never creates, edits, or deletes a
# release. Release work is tag-gated in release.yml.
#
# Version metadata is deliberately NOT checked here. check_version_consistency.py
# is the authoritative release gate and runs once, in release.yml, against the
# tagged commit. Forcing it on every commit duplicated the same answer and made
# an ordinary compiler commit look like a release concern.

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master, develop ]
  # Cross-platform verification is expensive, so it runs on demand and on a
  # weekly sweep instead of on every commit.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a superseded pull request run is cancelled. Push, schedule, and manual
  # runs are never cancelled, so an in-flight check is always left visible
  # instead of being silently replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: fmt / check / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report context
        run: |
          echo "commit : ${{ github.sha }}"
          echo "ref    : ${{ github.ref }}"
          echo "event  : ${{ github.event_name }}"
          echo "cargo  : $(cargo --version)"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --no-fail-fast

  cross-target:
    name: Cross-target build (${{ matrix.target }})
    # Release-grade cross-platform artifacts are built by release.yml from the
    # tag. This sweep exists so a target that stopped compiling is still caught
    # between releases, which is why it must not run on every commit.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: tarvos.exe
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            binary_name: tarvos.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: tarvos
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: tarvos
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: tarvos
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report context
        run: |
          echo "commit : ${{ github.sha }}"
          echo "target : ${{ matrix.target }}"
          echo "cargo  : $(cargo --version)"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Windows GNU toolchain
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH

      - name: Build release CLI for target
        run: cargo build --release --target ${{ matrix.target }} -p tarvos-cli

      - name: Report built binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ ! -f "$binary" ]; then
            echo "::error title=Missing binary::$binary was not produced for ${{ matrix.target }}"
            exit 1
          fi
          ls -l "$binary"
