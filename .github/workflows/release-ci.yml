name: Tarvos 1.5.0 release validation

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tarvos
        run: cargo build --release --bin tarvos

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run production validation suite
        run: python validation/run_validation.py

      - name: Run benchmark matrix
        run: python benchmarks/benchmark_matrix.py --runtime all --repeats 1 --json-output benchmarks/results/runtime_matrix.json

      - name: Upload runtime matrix JSON
        uses: actions/upload-artifact@v4
        with:
          name: runtime-matrix
          path: benchmarks/results/runtime_matrix.json
