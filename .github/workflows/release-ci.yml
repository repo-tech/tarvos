name: Tarvos release validation

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tarvos
        run: cargo build --release --bin tarvos

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run production validation suite
        run: python validation/run_validation.py

      - name: Verify Python to Rust and native executable flows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-tmp/ci-smoke
          ./target/release/tarvos compile examples/simple.py --output .build-tmp/ci-smoke/simple.rs
          ./target/release/tarvos build examples/simple.py --output .build-tmp/ci-smoke/simple
          test -s .build-tmp/ci-smoke/simple.rs
          test "$(.build-tmp/ci-smoke/simple)" = "50000005000000"

      - name: Run benchmark matrix
        run: python benchmarks/benchmark_matrix.py --runtime all --repeats 7 --json-output benchmarks/results/runtime_matrix.json

      - name: Upload runtime matrix JSON
        uses: actions/upload-artifact@v4
        with:
          name: runtime-matrix
          path: benchmarks/results/runtime_matrix.json
