name: Tarvos Production Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish"
        required: true
        default: "v1.1.0-rc.2"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            asset_name: tarvos-windows-x86_64.exe
            binary_name: tarvos.exe
          - platform: linux-x86_64
            os: ubuntu-latest
            asset_name: tarvos-linux-x86_64
            binary_name: tarvos
          - platform: macos-x86_64
            os: macos-latest
            asset_name: tarvos-macos-x86_64
            binary_name: tarvos

    env:
      RUSTFLAGS: "-C opt-level=z -C strip=symbols -C target-cpu=native"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build optimized CLI
        run: cargo build --release --bin tarvos

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "target\release\${{ matrix.binary_name }}"
          $destination = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.asset_name }}"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Expected release binary was not produced: $source"
          }
          Copy-Item -LiteralPath $source -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset_name }}" | Set-Content -LiteralPath "$destination.sha256" -NoNewline

      - name: Build blue Windows setup executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          New-Item -ItemType Directory -Force -Path installer\payload | Out-Null
          Copy-Item "${{ matrix.asset_name }}" installer\payload\tarvos.exe
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Tarvos.iss
          $setup = "installer\output\Tarvos-Setup-Windows-x86_64.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Windows setup executable was not produced."
          }
          Copy-Item $setup Tarvos-Setup-Windows-x86_64.exe
          $hash = (Get-FileHash Tarvos-Setup-Windows-x86_64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tarvos-Setup-Windows-x86_64.exe" | Set-Content Tarvos-Setup-Windows-x86_64.exe.sha256 -NoNewline

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          source="target/release/${{ matrix.binary_name }}"
          destination="${{ matrix.asset_name }}"
          test -f "$source"
          cp "$source" "$destination"
          chmod 0755 "$destination"
          shasum -a 256 "$destination" > "$destination.sha256"

      - name: Upload staged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows setup executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Tarvos-Setup-Windows-x86_64
          path: |
            Tarvos-Setup-Windows-x86_64.exe
            Tarvos-Setup-Windows-x86_64.exe.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download production binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tarvos-*
          merge-multiple: true
          path: release-assets

      - name: Download Windows setup executable
        uses: actions/download-artifact@v4
        with:
          name: Tarvos-Setup-Windows-x86_64
          path: release-assets

      - name: Verify release asset boundary
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "tarvos-windows-x86_64.exe"
            "tarvos-linux-x86_64"
            "tarvos-macos-x86_64"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
            test -f "release-assets/$asset.sha256"
          done
          test -f release-assets/Tarvos-Setup-Windows-x86_64.exe
          test -f release-assets/Tarvos-Setup-Windows-x86_64.exe.sha256
          find release-assets -type f -printf '%f\n' | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 8

      - name: Upload production binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: repo-tech/tarvos-engine
          token: ${{ secrets.TARVOS_DISTRIBUTION_TOKEN }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/tarvos-windows-x86_64.exe
            release-assets/tarvos-windows-x86_64.exe.sha256
            release-assets/Tarvos-Setup-Windows-x86_64.exe
            release-assets/Tarvos-Setup-Windows-x86_64.exe.sha256
            release-assets/tarvos-linux-x86_64
            release-assets/tarvos-linux-x86_64.sha256
            release-assets/tarvos-macos-x86_64
            release-assets/tarvos-macos-x86_64.sha256
          draft: false
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
          generate_release_notes: true
