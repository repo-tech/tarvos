name: Tarvos Production Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish"
        required: true
        default: "v1.1.0-rc.3"

# The workflow only builds and validates artifacts; publishing uses the
# dedicated distribution token, so the default GITHUB_TOKEN only needs read
# access to this repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-source:
    name: Verify release source and version
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version metadata consistency
        run: python scripts/check_version_consistency.py

      - name: Verify the release tag exists and matches the workspace version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/check_version_consistency.py --require-tag "$RELEASE_TAG"

      - name: Verify the release tag points into main history
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main

      - name: Verify the release body exists for the tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/extract_release_notes.py "$RELEASE_TAG" > /tmp/release-body.md
          test -s /tmp/release-body.md

  build:
    name: Build release binary
    needs: verify-release-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            asset_name: tarvos-windows-x86_64.exe
            binary_name: tarvos.exe
          - platform: linux-x86_64
            os: ubuntu-latest
            asset_name: tarvos-linux-x86_64
            binary_name: tarvos
          - platform: macos-x86_64
            os: macos-latest
            asset_name: tarvos-macos-x86_64
            binary_name: tarvos

    env:
      RUSTFLAGS: "-C opt-level=z -C strip=symbols -C target-cpu=native"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          # Always build the tagged commit. Without an explicit `ref`, a
          # workflow_dispatch run checks out `main` HEAD and then publishes
          # those binaries under the release tag, so the artifact would not
          # match the tagged source.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build optimized CLI
        run: cargo build --release --bin tarvos

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "target\release\${{ matrix.binary_name }}"
          $destination = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.asset_name }}"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Expected release binary was not produced: $source"
          }
          Copy-Item -LiteralPath $source -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset_name }}" | Set-Content -LiteralPath "$destination.sha256" -NoNewline

      - name: Build blue Windows setup executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          New-Item -ItemType Directory -Force -Path installer\payload | Out-Null
          Copy-Item "${{ matrix.asset_name }}" installer\payload\tarvos.exe
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Tarvos.iss
          $setup = "installer\output\Tarvos-Setup-Windows-x86_64.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Windows setup executable was not produced."
          }
          Copy-Item $setup Tarvos-Setup-Windows-x86_64.exe
          $hash = (Get-FileHash Tarvos-Setup-Windows-x86_64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tarvos-Setup-Windows-x86_64.exe" | Set-Content Tarvos-Setup-Windows-x86_64.exe.sha256 -NoNewline

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          source="target/release/${{ matrix.binary_name }}"
          destination="${{ matrix.asset_name }}"
          test -f "$source"
          cp "$source" "$destination"
          chmod 0755 "$destination"
          shasum -a 256 "$destination" > "$destination.sha256"

      - name: Upload staged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows setup executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Tarvos-Setup-Windows-x86_64
          path: |
            Tarvos-Setup-Windows-x86_64.exe
            Tarvos-Setup-Windows-x86_64.exe.sha256
          if-no-files-found: error
          retention-days: 1

  publish-source-release:
    name: Publish source release on GitHub
    needs: [verify-release-source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare release body from RELEASE_NOTES.md
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/extract_release_notes.py "$RELEASE_TAG" > release-body.md
          test -s release-body.md
          # At most one comparison link. Auto-generated notes used to append a
          # second "Full Changelog" block to the hand-written one, which is the
          # duplicated body seen on the deleted v1.2.0 draft.
          links="$(grep -c '^https://github.com/repo-tech/tarvos/compare/' release-body.md || true)"
          test "$links" -le 1

      - name: Create or update the GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A release must never invent a version: the tag has to exist already.
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          title="Tarvos $RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-body.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release-body.md \
              --verify-tag \
              --prerelease="$([[ "$RELEASE_TAG" == *-* ]] && echo true || echo false)"
          fi
          gh release view "$RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,url

  publish-distribution:
    name: Publish distribution assets
    needs: [verify-release-source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare release body from RELEASE_NOTES.md
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/extract_release_notes.py "$RELEASE_TAG" > release-body.md
          test -s release-body.md

      - name: Download production binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tarvos-*
          merge-multiple: true
          path: release-assets

      - name: Download Windows setup executable
        uses: actions/download-artifact@v4
        with:
          name: Tarvos-Setup-Windows-x86_64
          path: release-assets

      - name: Verify release asset boundary
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "tarvos-windows-x86_64.exe"
            "tarvos-linux-x86_64"
            "tarvos-macos-x86_64"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
            test -f "release-assets/$asset.sha256"
          done
          test -f release-assets/Tarvos-Setup-Windows-x86_64.exe
          test -f release-assets/Tarvos-Setup-Windows-x86_64.exe.sha256
          find release-assets -type f -printf '%f\n' | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 8

      - name: Upload production binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: repo-tech/tarvos-engine
          token: ${{ secrets.TARVOS_DISTRIBUTION_TOKEN }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # The body comes from RELEASE_NOTES.md only. Auto-generated notes
          # would append a second "Full Changelog" block to the hand-written
          # one, which is the duplicated body seen on the deleted v1.2.0 draft.
          body_path: release-body.md
          generate_release_notes: false
          files: |
            release-assets/tarvos-windows-x86_64.exe
            release-assets/tarvos-windows-x86_64.exe.sha256
            release-assets/Tarvos-Setup-Windows-x86_64.exe
            release-assets/Tarvos-Setup-Windows-x86_64.exe.sha256
            release-assets/tarvos-linux-x86_64
            release-assets/tarvos-linux-x86_64.sha256
            release-assets/tarvos-macos-x86_64
            release-assets/tarvos-macos-x86_64.sha256
          draft: false
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, '-') }}
